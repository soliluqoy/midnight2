name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default; jobs that publish or sign ask for more. Actions are pinned to commits.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci
      - name: Native helpers (Ctrl+Win listener, on-device OCR)
        run: node scripts/build-native.mjs
      - name: Unit, end-to-end, adversarial and architecture tests
        run: npm test
      - name: Dashboard interactions, async races and keyboard navigation
        run: npm run test:ui
      - name: Pinned apps, browser profiles, page sharing, IPC isolation and connector views
        run: npm run test:apps
      - name: App starts, engine comes up, launcher and Apps preserve window focus, native pieces load
        run: npm run test:smoke
      - name: Every launcher state renders without errors (pixel baselines are machine-specific)
        run: npm run test:visual
        env:
          VISUAL_ERRORS_ONLY: "1"

  build:
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write # Azure Artifact Signing through OIDC (no long-lived secret)
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
          - os: macos-14
            args: --mac --arm64
          # Pinned: ubuntu-latest moves to Ubuntu 26, and the AppImage toolchain should change on purpose.
          - os: ubuntu-24.04
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci
      - name: Native helpers (Windows; a no-op elsewhere)
        run: node scripts/build-native.mjs
      # Windows signing with Azure Artifact Signing when the repository is configured for it (repository variables
      # AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT,
      # AZURE_SIGNING_PROFILE and AZURE_SIGNING_PUBLISHER). Without them the build is unsigned and the in-app updater
      # refuses to install it (it opens the release page instead).
      - name: Sign in to Azure for code signing
        if: matrix.os == 'windows-latest' && vars.AZURE_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build
        shell: bash
        run: |
          SIGN=()
          if [ "${{ matrix.os }}" = "windows-latest" ] && [ -n "${{ vars.AZURE_SIGNING_ACCOUNT }}" ]; then
            SIGN=(
              -c.win.azureSignOptions.endpoint="${{ vars.AZURE_SIGNING_ENDPOINT }}"
              -c.win.azureSignOptions.codeSigningAccountName="${{ vars.AZURE_SIGNING_ACCOUNT }}"
              -c.win.azureSignOptions.certificateProfileName="${{ vars.AZURE_SIGNING_PROFILE }}"
              -c.win.azureSignOptions.publisherName="${{ vars.AZURE_SIGNING_PUBLISHER }}"
            )
          fi
          npx electron-builder ${{ matrix.args }} --publish never "${SIGN[@]}"
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: The packaged app starts with its fuses and archive (asar integrity, unpacked native helpers)
        if: matrix.os == 'windows-latest'
        run: node scripts/smoke.mjs --packaged release/win-unpacked/midnight.exe
      - name: Software bill of materials
        if: matrix.os == 'windows-latest'
        run: node scripts/sbom.mjs
      - name: Stable file names (the installers download releases/latest/download/<name>)
        shell: bash
        run: |
          cd release
          for f in *.zip *.AppImage; do
            [ -f "$f" ] || continue
            case "$f" in
              midnight-win-x64.zip|midnight-mac-arm64.zip|midnight-linux-x64.AppImage) ;;
              *win*) mv "$f" midnight-win-x64.zip ;;
              *mac*) mv "$f" midnight-mac-arm64.zip ;;
              *.AppImage) mv "$f" midnight-linux-x64.AppImage ;;
            esac
          done
          ls -la
      - name: Build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release/midnight-*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-${{ matrix.os }}
          path: |
            release/midnight-*
            release/latest.yml
            release/sbom.json
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: true # published by a person after checking the assets
          body: |
            ## Install

            **Windows (x64)**: run `midnight-setup-x64.exe` (per-user, no admin), or in PowerShell:
            ```powershell
            irm https://raw.githubusercontent.com/soliluqoy/midnight2/main/install.ps1 | iex
            ```

            **macOS (Apple silicon) / Linux (x86_64)**, in a terminal:
            ```sh
            curl -fsSL https://raw.githubusercontent.com/soliluqoy/midnight2/main/install.sh | sh
            ```

            Summon with Ctrl+Win on Windows, Ctrl+Alt+M on Linux, or Cmd+Alt+M on macOS, then sign in from the gear icon.
            Artifacts carry GitHub build provenance (`gh attestation verify <file> --repo soliluqoy/midnight2`).
            Desktop control and on-device OCR are Windows-only. See the README for usage and local search setup.
